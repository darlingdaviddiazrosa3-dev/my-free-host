<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Dominican Galaxy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container bg-white p-4 rounded shadow">
        <h2 class="text-center mb-4">Panel de Control</h2>
        
        <div class="d-grid gap-2">
            <button id="btnConectar" class="btn btn-primary btn-lg">Probar Conexión</button>
        </div>

        <div id="resultado" class="mt-4 alert alert-secondary text-center" style="display: none;">
            Esperando acción...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // URL de tu servidor en Render
        const SERVER_URL = "https://my-free-host.onrender.com";

        document.getElementById('btnConectar').addEventListener('click', () => {
            const contenedorResultado = document.getElementById('resultado');
            contenedorResultado.style.display = 'block';
            contenedorResultado.className = 'mt-4 alert alert-info text-center';
            contenedorResultado.innerText = 'Conectando al servidor...';

            // Petición corregida a POST y con la ruta exacta
            fetch(`${SERVER_URL}/api/create-server`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta del servidor');
                }
                return response.json();
            })
            .then(data => {
                contenedorResultado.className = 'mt-4 alert alert-success text-center';
                contenedorResultado.innerText = '¡Conexión exitosa!: ' + JSON.stringify(data);
            })
            .catch(error => {
                console.error('Error:', error);
                contenedorResultado.className = 'mt-4 alert alert-danger text-center';
                contenedorResultado.innerText = 'Error al conectar con el servidor. Verifica si Render está activo.';
            });
        });
    </script>
</body>
</html>
